<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="520" font-family="Inter, Helvetica Neue, Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#29B5E8"/>
    </marker>
    <marker id="arrow-dark" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#11567F"/>
    </marker>
    <marker id="arrow-gray" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#8A9BAE"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1100" height="520" fill="#F7FBFE" rx="12"/>

  <!-- Lane labels -->
  <rect x="0" y="0" width="1100" height="24" fill="#11567F" rx="12"/>
  <rect x="0" y="12" width="1100" height="12" fill="#11567F"/>
  <text x="20" y="17" fill="white" font-size="11" font-weight="600" letter-spacing="1">PROTECTION THAT FOLLOWS THE DATA — AUTOMATICALLY</text>

  <!-- Lane 1 background: Configure Once -->
  <rect x="12" y="36" width="1076" height="210" fill="white" rx="8" stroke="#D6EAF5" stroke-width="1.5"/>
  <text x="28" y="58" fill="#11567F" font-size="11" font-weight="700" letter-spacing="1.5">CONFIGURE ONCE</text>

  <!-- Lane 2 background: Works Automatically -->
  <rect x="12" y="262" width="1076" height="210" fill="white" rx="8" stroke="#D6EAF5" stroke-width="1.5"/>
  <text x="28" y="284" fill="#11567F" font-size="11" font-weight="700" letter-spacing="1.5">WORKS AUTOMATICALLY</text>

  <!-- ===================== LANE 1 ===================== -->

  <!-- Box 1: SYSTEM$CLASSIFY -->
  <rect x="28" y="100" width="170" height="100" rx="8" fill="#29B5E8" />
  <text x="113" y="135" text-anchor="middle" fill="white" font-size="13" font-weight="700">SYSTEM$CLASSIFY</text>
  <text x="113" y="155" text-anchor="middle" fill="white" font-size="10">Scans column names</text>
  <text x="113" y="170" text-anchor="middle" fill="white" font-size="10">and sample values</text>

  <!-- Arrow 1→2 -->
  <line x1="198" y1="150" x2="248" y2="150" stroke="#29B5E8" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="223" y="143" text-anchor="middle" fill="#8A9BAE" font-size="9">detects</text>

  <!-- Box 2: SEMANTIC_CATEGORY (dashed = system-managed) -->
  <rect x="250" y="100" width="170" height="100" rx="8" fill="white" stroke="#29B5E8" stroke-width="2" stroke-dasharray="6,3"/>
  <text x="335" y="130" text-anchor="middle" fill="#29B5E8" font-size="11" font-weight="700">SEMANTIC_CATEGORY</text>
  <text x="335" y="148" text-anchor="middle" fill="#29B5E8" font-size="10">system tag</text>
  <text x="335" y="168" text-anchor="middle" fill="#8A9BAE" font-size="9">NAME · EMAIL · SSN</text>
  <text x="335" y="183" text-anchor="middle" fill="#8A9BAE" font-size="9">PHONE_NUMBER · SALARY</text>

  <!-- Arrow 2→3 -->
  <line x1="420" y1="150" x2="470" y2="150" stroke="#29B5E8" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="445" y="143" text-anchor="middle" fill="#8A9BAE" font-size="9">tag map</text>

  <!-- Box 3: pii tag (user-defined, highlighted) -->
  <rect x="472" y="90" width="170" height="120" rx="8" fill="#11567F"/>
  <text x="557" y="125" text-anchor="middle" fill="white" font-size="11" font-weight="600" letter-spacing="0.5">USER-DEFINED TAG</text>
  <rect x="507" y="135" width="100" height="30" rx="5" fill="#29B5E8"/>
  <text x="557" y="155" text-anchor="middle" fill="white" font-size="14" font-weight="800">pii</text>
  <text x="557" y="192" text-anchor="middle" fill="#A8D8F0" font-size="9">high · medium · low</text>

  <!-- Arrow 3→4 -->
  <line x1="642" y1="150" x2="692" y2="150" stroke="#29B5E8" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="667" y="143" text-anchor="middle" fill="#8A9BAE" font-size="9">carries</text>

  <!-- Box 4: Masking Policy -->
  <rect x="694" y="100" width="170" height="100" rx="8" fill="white" stroke="#11567F" stroke-width="2"/>
  <!-- lock icon approximation -->
  <rect x="768" y="107" width="18" height="14" rx="3" fill="#11567F"/>
  <path d="M772 107 Q772 100 779 100 Q786 100 786 107" fill="none" stroke="#11567F" stroke-width="2.5"/>
  <text x="779" y="139" text-anchor="middle" fill="#11567F" font-size="11" font-weight="700">MASKING POLICY</text>
  <text x="779" y="157" text-anchor="middle" fill="#8A9BAE" font-size="9">pii_string_mask</text>
  <text x="779" y="170" text-anchor="middle" fill="#8A9BAE" font-size="9">pii_number_mask</text>
  <text x="779" y="186" text-anchor="middle" fill="#8A9BAE" font-size="9">PRIVILEGED_ANALYST only</text>

  <!-- ===================== PROPAGATION CONNECTOR ===================== -->
  <!-- Vertical line from pii tag (lane 1) down to pii tag on arrow (lane 2) -->
  <line x1="557" y1="210" x2="557" y2="298" stroke="#29B5E8" stroke-width="2" stroke-dasharray="5,3" marker-end="url(#arrow)"/>
  <rect x="445" y="228" width="224" height="22" rx="4" fill="#E8F7FD"/>
  <text x="557" y="243" text-anchor="middle" fill="#11567F" font-size="10" font-weight="600">PROPAGATE = ON_DATA_MOVEMENT</text>

  <!-- ===================== LANE 2 ===================== -->

  <!-- Box 5: ENTERPRISE_DB -->
  <rect x="28" y="298" width="170" height="140" rx="8" fill="white" stroke="#29B5E8" stroke-width="2"/>
  <text x="113" y="320" text-anchor="middle" fill="#11567F" font-size="11" font-weight="700">ENTERPRISE_DB</text>
  <!-- table icon rows -->
  <rect x="48" y="328" width="130" height="18" rx="3" fill="#F0F9FE" stroke="#D6EAF5" stroke-width="1"/>
  <text x="113" y="341" text-anchor="middle" fill="#29B5E8" font-size="9" font-weight="600">employees</text>
  <rect x="48" y="350" width="130" height="12" rx="2" fill="#F7FBFE"/>
  <text x="113" y="360" text-anchor="middle" fill="#11567F" font-size="8">first_name  🏷 pii=high</text>
  <rect x="48" y="365" width="130" height="12" rx="2" fill="#F7FBFE"/>
  <text x="113" y="375" text-anchor="middle" fill="#11567F" font-size="8">ssn  🏷 pii=high</text>
  <rect x="48" y="380" width="130" height="12" rx="2" fill="#F7FBFE"/>
  <text x="113" y="390" text-anchor="middle" fill="#11567F" font-size="8">salary  🏷 pii=medium</text>
  <text x="113" y="415" text-anchor="middle" fill="#8A9BAE" font-size="8" font-style="italic">pii tag on sensitive columns</text>

  <!-- Arrow: CTAS -->
  <line x1="198" y1="368" x2="380" y2="368" stroke="#11567F" stroke-width="2.5" marker-end="url(#arrow-dark)"/>
  <rect x="240" y="348" width="100" height="22" rx="4" fill="#11567F"/>
  <text x="290" y="363" text-anchor="middle" fill="white" font-size="10" font-weight="700">CTAS</text>
  <text x="290" y="393" text-anchor="middle" fill="#8A9BAE" font-size="8" font-style="italic">pii tag travels with data</text>

  <!-- Box 6: TEAMSPACE_DB -->
  <rect x="382" y="298" width="170" height="140" rx="8" fill="white" stroke="#29B5E8" stroke-width="2"/>
  <text x="467" y="320" text-anchor="middle" fill="#11567F" font-size="11" font-weight="700">TEAMSPACE_DB</text>
  <rect x="402" y="328" width="130" height="18" rx="3" fill="#F0F9FE" stroke="#D6EAF5" stroke-width="1"/>
  <text x="467" y="341" text-anchor="middle" fill="#29B5E8" font-size="9" font-weight="600">employees_copy</text>
  <rect x="402" y="350" width="130" height="12" rx="2" fill="#F7FBFE"/>
  <text x="467" y="360" text-anchor="middle" fill="#11567F" font-size="8">first_name  🏷 pii=high</text>
  <rect x="402" y="365" width="130" height="12" rx="2" fill="#F7FBFE"/>
  <text x="467" y="375" text-anchor="middle" fill="#11567F" font-size="8">ssn  🏷 pii=high</text>
  <rect x="402" y="380" width="130" height="12" rx="2" fill="#F7FBFE"/>
  <text x="467" y="390" text-anchor="middle" fill="#11567F" font-size="8">salary  🏷 pii=medium</text>
  <text x="467" y="415" text-anchor="middle" fill="#8A9BAE" font-size="8" font-style="italic">tag propagated automatically</text>

  <!-- Arrow: query -->
  <line x1="552" y1="368" x2="640" y2="368" stroke="#29B5E8" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="596" y="360" text-anchor="middle" fill="#8A9BAE" font-size="8">query as</text>
  <text x="596" y="372" text-anchor="middle" fill="#8A9BAE" font-size="8">ANALYST</text>

  <!-- Box 7: Masked output -->
  <rect x="642" y="298" width="210" height="140" rx="8" fill="#FFF8F0" stroke="#E8A838" stroke-width="2"/>
  <text x="747" y="320" text-anchor="middle" fill="#B8740A" font-size="11" font-weight="700">ANALYST SEES</text>
  <rect x="662" y="328" width="170" height="16" rx="3" fill="#FEF0D0"/>
  <text x="747" y="340" text-anchor="middle" fill="#B8740A" font-size="9" font-weight="600">employees_copy</text>
  <rect x="662" y="348" width="170" height="12" rx="2" fill="white"/>
  <text x="747" y="358" text-anchor="middle" fill="#CC0000" font-size="8">first_name  ***REDACTED***</text>
  <rect x="662" y="363" width="170" height="12" rx="2" fill="white"/>
  <text x="747" y="373" text-anchor="middle" fill="#CC0000" font-size="8">ssn  ***REDACTED***</text>
  <rect x="662" y="378" width="170" height="12" rx="2" fill="white"/>
  <text x="747" y="388" text-anchor="middle" fill="#CC0000" font-size="8">salary  -1</text>
  <text x="747" y="415" text-anchor="middle" fill="#B8740A" font-size="8" font-style="italic">masking enforced in the copy</text>

  <!-- Note: dashed = system managed -->
  <rect x="870" y="350" width="210" height="60" rx="6" fill="white" stroke="#D6EAF5" stroke-width="1"/>
  <line x1="880" y1="368" x2="910" y2="368" stroke="#29B5E8" stroke-width="1.5" stroke-dasharray="4,2"/>
  <text x="920" y="372" fill="#8A9BAE" font-size="9">= Snowflake-managed</text>
  <line x1="880" y1="390" x2="910" y2="390" stroke="#11567F" stroke-width="1.5"/>
  <text x="920" y="394" fill="#8A9BAE" font-size="9">= User-defined</text>

</svg>